services:
  hyunsolutionDB: # MySQL 컨테이너
    container_name: hyunsolution-db   # MySQL 컨테이너 이름
    image: mysql:8.4.0
    restart: always
    volumes:
      - mysql_volume:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - TZ=Asia/Seoul
    ports:
      - "3306:3306"
    networks:
      - HS-net
    healthcheck:
      test: [ 'CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
      timeout: 20s
      retries: 10

  SpringServer: # Spring Boot 컨테이너
    container_name: hyunsolution-server  # Spring Boot 컨테이너 이름
    image: ${DOCKER_IMAGE_NAME}
    ports:
      - "8080:8080"
    volumes:
      - HS_images:/app/HS/images
    networks:
      - HS-net
    depends_on:
      hyunsolutionDB:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://hyunsolutionDB:3306/nomad
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

  nginx:
    container_name: nginx
    image: nginx:latest
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - /data/nginx:/etc/nginx/conf.d
      - /data/certbot/conf:/etc/letsencrypt
      - /data/certbot/www:/var/www/certbot
    depends_on:
      - "SpringServer"
    networks:
     - HS-net
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - /data/certbot/conf:/etc/letsencrypt
      - /data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  HS-net:
    driver: bridge
    external: true

volumes:
  mysql_volume:
    driver: local
  HS_images:
    driver: local

